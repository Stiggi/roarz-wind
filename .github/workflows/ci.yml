# Tests of the pipeline and the upload script – no secrets, no network to the webspace.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: AGENTS.md und CLAUDE.md sind identisch
        run: |
          if ! cmp -s AGENTS.md CLAUDE.md; then
            echo "::error::AGENTS.md und CLAUDE.md unterscheiden sich. Beide Dateien synchron halten."
            diff -u AGENTS.md CLAUDE.md || true
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Wind-Pipeline (Python) und Upload-Skript
        run: |
          pip install -q -r pipeline/requirements.txt
          python -m py_compile pipeline/icon_wind.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/ftp_wind.test.sh
